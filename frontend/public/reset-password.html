<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e8eef5;
            --success: #27ae60;
            --error: #e74c3c;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--text-primary);
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        dl {
            display: flex;
            flex-direction: column;
        }

        dt {
            color: var(--text-primary);
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: capitalize;
            letter-spacing: 0.3px;
        }

        dd {
            margin-bottom: 0;
            margin-left: 0;
        }

        input[type="email"],
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            background-color: #f8f9fb;
        }

        input[type="email"]:hover,
        input[type="text"]:hover,
        input[type="password"]:hover {
            background-color: white;
            border-color: #d0d8e8;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        input::placeholder {
            color: var(--text-secondary);
            opacity: 0.7;
        }

        button {
            width: 100%;
            padding: 14px 24px;
            margin-top: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.35);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .reset-section {
            display: none;
        }

        .reset-section.active {
            display: block;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 35px;
            }
            h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }
            button {
                padding: 12px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Reset Password</h1>
        <form id="resetForm">
            <div class="request-section" id="requestSection">
                <dl>
                    <dt>Email:</dt>
                    <dd><input type="email" id="email" placeholder="Enter your registered email" required></dd>
                </dl>
                <button type="submit" id="requestBtn">Send Reset OTP</button>
            </div>

            <div class="reset-section" id="resetSection">
                <dl>
                    <dt>OTP Code:</dt>
                    <dd><input type="text" id="otp" inputmode="numeric" pattern="\d*" maxlength="6" placeholder="6-digit OTP" required></dd>

                    <dt>New Password:</dt>
                    <dd><input type="password" id="newPassword" placeholder="Min 8 chars, one uppercase, one lowercase, one number" required></dd>

                    <dt>Confirm Password:</dt>
                    <dd><input type="password" id="confirmPassword" placeholder="Confirm new password" required></dd>
                </dl>
                <button type="button" id="resetBtn">Reset Password</button>
            </div>
        </form>
        <div id="message" class="message"></div>
        <div class="links">
            <a href="/login.html">Back to Login</a>
            <a href="/register.html">Create Account</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api/v1';
        let pendingEmail = null;

        function showMessage(text, type = 'error') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        async function requestReset(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showMessage('Please enter your email', 'error');
                return;
            }

            const requestBtn = document.getElementById('requestBtn');
            requestBtn.disabled = true;
            requestBtn.textContent = 'Sending...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/password-reset/request`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Failed to send reset OTP');
                }

                pendingEmail = email;
                showMessage('Reset OTP sent to your email. Enter it below.', 'success');
                document.getElementById('requestSection').style.display = 'none';
                document.getElementById('resetSection').classList.add('active');
            } catch (err) {
                showMessage(err.message, 'error');
                requestBtn.disabled = false;
                requestBtn.textContent = 'Send Reset OTP';
            }
        }

        async function resetPassword() {
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!otp || !/^\d{6}$/.test(otp)) {
                showMessage('Please enter a valid 6-digit OTP', 'error');
                return;
            }
            if (!newPassword || !confirmPassword) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(newPassword)) {
                showMessage('Password must be at least 8 characters with one uppercase, one lowercase, and one number', 'error');
                return;
            }
            if (!pendingEmail) {
                showMessage('Please request OTP first', 'error');
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.textContent = 'Resetting...';

            try {
                const response = await fetch(`${API_BASE_URL}/auth/password-reset/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail, otp_code: otp, new_password: newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Password reset failed');
                }

                showMessage('Password reset successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (err) {
                showMessage(err.message, 'error');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reset Password';
            }
        }

        document.getElementById('resetForm').addEventListener('submit', requestReset);
        document.getElementById('resetBtn').addEventListener('click', resetPassword);
    </script>
</body>
</html>
